name: Real Codex migration
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  # Use the same public native release on all three operating systems.
  CODEX_TEST_VERSION: '0.159.3'
jobs:
  source:
    name: Native source / ${{ matrix.goos }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-latest
            goos: darwin
          - os: windows-latest
            goos: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install isolated real Codex
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-runtime" --include=optional --ignore-scripts --no-audit --no-fund "@openai/codex@$CODEX_TEST_VERSION"
          node scripts/resolve-test-codex.mjs "$RUNNER_TEMP/codex-runtime"
      - name: Verify native restart and capture real sender data
        env:
          CODEX_TRANSFER_EXPORT_DIR: ${{ runner.temp }}/codex-exports
        run: go test -race ./e2e -run '^(TestRealCodexSessionRestart|TestRealCodexArchiveRoundTrip|TestRealCodexExport)$' -v -count=1 -timeout=10m
      - name: Share unchanged native sender data
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: real-codex-${{ matrix.goos }}
          path: ${{ runner.temp }}/codex-exports
          if-no-files-found: error
          retention-days: 3
  destination:
    name: Native destination / ${{ matrix.goos }}
    needs: source
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
          - os: macos-latest
            goos: darwin
          - os: windows-latest
            goos: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Install isolated real Codex
        shell: bash
        run: |
          npm install --prefix "$RUNNER_TEMP/codex-runtime" --include=optional --ignore-scripts --no-audit --no-fund "@openai/codex@$CODEX_TEST_VERSION"
          node scripts/resolve-test-codex.mjs "$RUNNER_TEMP/codex-runtime"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: real-codex-*
          path: ${{ runner.temp }}/codex-imports
      - name: Receive both foreign systems and resume imported conversations
        env:
          CODEX_TRANSFER_IMPORT_DIR: ${{ runner.temp }}/codex-imports
        run: go test -race ./e2e -run '^TestRealCodexCrossPlatformImport$' -v -count=1 -timeout=10m
