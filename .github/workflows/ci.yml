name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  lint:
    name: GolangCI lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Match the Go toolchain used to build the pinned analyzer.
          go-version: '1.27.x'
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          args: --timeout=5m
      - name: Check configured formatters
        run: |
          golangci-lint fmt
          git diff --exit-code
  go:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l cmd internal e2e)"
      - name: Static analysis
        run: go vet ./...
      - name: Unit and CLI end-to-end tests with race detection
        run: go test -race ./... -count=1
      - name: Build CLI
        run: go build ./cmd
  documentation:
    name: README and logo references
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - run: python3 scripts/check-readme.py
