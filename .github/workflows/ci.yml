name: CI
on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  real-e2e:
    name: Real Codex on macOS, Windows, and Linux
    uses: ./.github/workflows/real-e2e.yml
  lint:
    name: GolangCI lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          # Pin the verified patch; newer export formats may require a newer analyzer.
          go-version: '1.27.1'
          cache: false
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.13.2
          args: --timeout=5m
      - name: Check configured formatters
        run: |
          golangci-lint fmt
          git diff --exit-code
  go:
    name: Go ${{ matrix.go }} / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.22.x', stable]
    runs-on: ${{ matrix.os }}
    env:
      # Recent macOS loaders require LC_UUID, which Go 1.22's internal linker omits.
      GOFLAGS: ${{ matrix.os == 'macos-latest' && matrix.go == '1.22.x' && '-ldflags=-linkmode=external' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: ${{ matrix.go }}
          cache: false
      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l cmd internal e2e .codex/hooks)"
          if [ -n "$unformatted" ]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi
      - name: Static analysis
        run: go vet ./... ./.codex/hooks
      - name: Unit and CLI end-to-end tests with race detection
        run: go test -race ./... ./.codex/hooks -count=1
      - name: Build CLI
        run: go build -o codex-transfer${{ runner.os == 'Windows' && '.exe' || '' }} ./cmd
