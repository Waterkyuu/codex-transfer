name: Release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  installer-checks:
    uses: ./.github/workflows/installers.yml
  release:
    needs: installer-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: go vet ./...
      - run: go test -race ./...
      - run: npm --prefix npm test
      - run: sh scripts/install.test.sh
      - uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  npm:
    # The public npm wrapper needs anonymously reachable release assets.
    if: ${{ !github.event.repository.private }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set package version from release tag
        working-directory: npm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm version "${RELEASE_TAG#v}" --no-git-tag-version --ignore-scripts
      - name: Publish npm package
        working-directory: npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$NODE_AUTH_TOKEN" || { echo 'Configure NPM_TOKEN before publishing.' >&2; exit 1; }
          channel=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then channel=next; fi
          npm publish --access public --tag "$channel" --ignore-scripts
