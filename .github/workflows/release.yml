name: Release
on:
  push:
    tags: ['v*']
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  code-checks:
    uses: ./.github/workflows/ci.yml
  installer-checks:
    uses: ./.github/workflows/installers.yml
  release:
    needs: [code-checks, installer-checks]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
          cache: false
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  npm:
    # The public npm wrapper needs anonymously reachable release assets.
    if: ${{ !github.event.repository.private }}
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Set package version from release tag
        working-directory: npm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo 'Expected a release tag such as v1.2.3 or v1.2.3-rc.1.' >&2
            exit 1
          fi
          npm version "${RELEASE_TAG#v}" --no-git-tag-version --ignore-scripts
      - name: Publish npm package with OIDC
        working-directory: npm
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          channel=latest
          if [[ "$RELEASE_TAG" == *-* ]]; then channel=next; fi
          npm publish --access public --tag "$channel" --ignore-scripts --provenance
