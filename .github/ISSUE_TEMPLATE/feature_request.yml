name: Feature request
description: Describe a use case and the behavior you need.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Search existing issues before requesting a feature. Describe the outcome you need so that alternative solutions can be considered.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: Explain what you are trying to accomplish, how you do it today, and what prevents the current commands from meeting your needs.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the desired outcome and include example commands when useful.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or other approaches you have tried and their limitations.
  - type: textarea
    id: platforms
    attributes:
      label: Platforms and context
      description: Mention source and destination operating systems, CPU architectures, data size, or network constraints when relevant.
