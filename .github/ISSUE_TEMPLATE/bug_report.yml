name: Bug report / 问题反馈
description: Report a reproducible transfer or installation problem. / 反馈可复现的传输或安装问题。
title: '[Bug]: '
body:
  - type: input
    id: version
    attributes:
      label: Version / 版本
      description: Paste the output of codex-transfer --version. / 填写版本命令的输出。
      placeholder: codex-transfer 0.1.0
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source OS and architecture / 发送端系统与架构
      placeholder: macOS 15, arm64; N/A for installation issues
    validations:
      required: true
  - type: input
    id: destination
    attributes:
      label: Destination OS and architecture / 接收端系统与架构
      placeholder: Windows 11, amd64; Ubuntu 24.04, arm64
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method / 安装方式
      options:
        - Release archive / 发布压缩包
        - Shell or PowerShell installer / 安装脚本
        - npm
        - Homebrew
        - Scoop
        - go install
        - Built from source / 源码编译
        - Other / 其他
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and commands / 复现步骤与命令
      description: Include commands from both terminals and the failing stage. / 提供两端命令及失败阶段。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior / 预期行为
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior / 实际行为
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant terminal output / 相关终端输出
      description: Remove credentials and private session content. / 请移除凭据和私人会话内容。
      render: text
