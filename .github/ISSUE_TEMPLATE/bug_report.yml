name: Bug report
description: Report a reproducible transfer or installation problem.
title: '[Bug]: '
body:
  - type: markdown
    attributes:
      value: |
        Check the [installation guide](https://github.com/Waterkyuu/codex-transfer/blob/main/docs/installation.en-US.md) and search existing issues before reporting a bug.
        Share only sanitized commands and output. Do not attach credentials, session content, or a copy of your Codex data directory.
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Installation or upgrade
        - Connection or pairing
        - Transfer or extraction
        - Path adaptation or restored data
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Paste the output of codex-transfer --version from each affected machine. If installation failed, give the version you tried to install.
      placeholder: codex-transfer 0.1.1
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source OS and architecture
      description: For migration issues, include the sender's OS version and CPU architecture. Leave blank for installation issues.
      placeholder: macOS 15, arm64
  - type: input
    id: destination
    attributes:
      label: Affected or destination OS and architecture
      description: Include the machine where installation failed or the receiving machine for a migration issue.
      placeholder: Windows 11, amd64; Ubuntu 24.04, arm64
    validations:
      required: true
  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Release archive
        - Shell installer
        - PowerShell installer
        - npm
        - Homebrew
        - Scoop
        - go install
        - Built from source
        - Other
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the exact commands, flags, and failing stage. For migrations, show commands from both terminals. Replace private paths and addresses with consistent placeholders.
      placeholder: |
        1. Run ... on the sender.
        2. Run ... on the receiver.
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Describe what happened and whether any destination files or backups were created.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant terminal output
      description: Include the error and nearby output from each affected terminal. Remove credentials, pairing codes, and private session content.
      render: text
